<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Главный воздух России</title>

  <!-- Иконки социальных сетей -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
  />

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      color: white;

      /* Первое прикреплённое изображение — фон */
      background:
        linear-gradient(rgba(0, 0, 0, 0.58), rgba(0, 0, 0, 0.75)),
        url("photo_2026-07-28_10-16-06.jpg") center / cover fixed no-repeat;
    }

    .profile {
      width: min(100%, 450px);
      padding: 36px 28px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 24px;
      background: rgba(10, 10, 10, 0.80);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(8px);
    }

    .avatar {
      width: 130px;
      height: 130px;
      margin: 0 auto 18px;
      overflow: hidden;
      border: 4px solid white;
      border-radius: 50%;
      box-shadow: 0 6px 25px rgba(0, 0, 0, 0.7);
    }

    .avatar img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 0.5px;
    }

    .subtitle {
      margin: 9px 0 26px;
      color: #d1d5db;
      font-size: 15px;
    }

    .links {
      display: grid;
      gap: 12px;
    }

    .links a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      min-height: 54px;
      padding: 14px 18px;
      border-radius: 14px;
      color: #ffffff;
      text-decoration: none;
      font-size: 17px;
      font-weight: 700;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.28);
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .links a:hover {
      transform: translateY(-3px) scale(1.02);
      filter: brightness(1.12);
    }

    .links i {
      width: 24px;
      font-size: 22px;
      text-align: center;
    }

    /* Цвета кнопок в стиле соцсетей */
    .telegram {
      background: #229ED9;
    }

    .discord {
      background: #5865F2;
    }

    .vk {
      background: #0077FF;
    }

    .gmail {
      background: #EA4335;
    }

    .pinterest {
      background: #E60023;
    }

    .spotify {
      background: #1DB954;
    }

    .instagram {
      background: linear-gradient(
        135deg,
        #833AB4,
        #FD1D1D,
        #FCAF45
      );
    }

    footer {
      margin-top: 25px;
      color: #d1d5db;
      font-size: 13px;
    }
  </style>
</head>

<body>
